# Lives at .github/workflows/pin.yml in your GitHub repository.
# Runs by itself every 2 hours, and whenever you click "Run workflow" in the Actions tab.
name: ShopMy to Pinterest

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What should this run do?"
        type: choice
        default: "Test run (posts nothing)"
        options:
          - "Test run (posts nothing)"
          - "Send one sample to Make"
          - "Normal run"
          - "Start pinning my existing items"

permissions:
  contents: write   # lets the job remember which products were already pinned

concurrency:
  group: pinner   # never run two at once, so they can't overwrite each other's records
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # give up instead of hanging forever
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        timeout-minutes: 5
        run: pip install -r requirements.txt
      - name: Run the pinner
        timeout-minutes: 12
        run: |
          case "${{ inputs.mode }}" in
            "Test run (posts nothing)") python shopmy_to_pinterest.py --dry-run --pin-existing ;;
            "Send one sample to Make") python shopmy_to_pinterest.py --send-sample ;;
            "Start pinning my existing items") python shopmy_to_pinterest.py --start-backlog ;;
            *) python shopmy_to_pinterest.py ;;
          esac
        env:
          SHOPMY_USERNAME: ${{ secrets.SHOPMY_USERNAME }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
      - name: Keep the raw page data from test runs
        if: always() && hashFiles('debug/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: debug-data
          path: debug/
      - name: Remember which products were pinned
        run: |
          git config user.name "pin-bot"
          git config user.email "pin-bot@users.noreply.github.com"
          git add pinned.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update pinned products"
            # If files were edited on GitHub during the run, fold those in before saving
            for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
          fi
